  <line x1="58.5" y1="36" x2="70.5" y2="24" stroke="#f39296" stroke-width="2.2" stroke-linecap="round"/>
  
  <!-- Top-Right 4-Point Sparkle Star -->
  <path d="M76.5 30.5 Q76.5 33.5 79.5 33.5 Q76.5 33.5 76.5 36.5 Q76.5 33.5 73.5 33.5 Q76.5 33.5 76.5 30.5 Z" fill="#f39296"/>
  
  <!-- Solid Bold Capital Letter M -->
  <path d="M40 39 H44.2 L50 51.5 L55.8 39 H60 V61 H56.2 V45.2 L51.6 55.2 H48.4 L43.8 45.2 V61 H40 Z" fill="#ffffff"/>
