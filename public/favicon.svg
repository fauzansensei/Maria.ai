<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Deep Navy Blue Squircle Background -->
  <rect width="100" height="100" rx="26" fill="#161e36"/>
  
  <!-- Silver-blue Circle Ring -->
  <circle cx="50" cy="50" r="28.5" stroke="#b8c5d6" stroke-width="2" fill="none"/>
  
  <!-- Diagonal Coral Pink Slash (Bottom-Left to Top-Right with gap for M) -->
