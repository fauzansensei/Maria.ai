<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maria AI — Settings Preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
body{background:#f3f6fc;color:#172554}
.app{max-width:1180px;margin:auto;padding:34px 24px}
header{margin-bottom:26px}
header h1{font-size:29px;letter-spacing:-.7px}
header p{color:#718096;margin-top:8px;font-size:14px}
.layout{display:grid;grid-template-columns:245px 1fr;gap:22px}
.sidebar,.panel{background:#fff;border:1px solid #e6ebf3;border-radius:18px;box-shadow:0 8px 28px #1e3a8a08}
.sidebar{padding:20px 14px;height:max-content}
.brand{padding:4px 10px 23px}
.brand strong{font-size:22px;color:#245bd7;letter-spacing:-.6px}
.brand span{display:block;color:#9aa8bd;font-size:10px;letter-spacing:2px;margin-top:5px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:12px 13px;border-radius:10px;text-align:left;color:#63718a;font-size:13px;margin:2px 0;cursor:pointer}
.menu button.active{background:#edf4ff;color:#245bd7;font-weight:700}
.menu button:hover{background:#f5f8fd}
.icon{width:19px;text-align:center;font-size:16px}
.panel{padding:29px 32px;min-height:560px}
.panel-head{padding-bottom:23px;border-bottom:1px solid #edf0f5;margin-bottom:3px}
.panel-head h2{font-size:22px;letter-spacing:-.4px}
.panel-head p{font-size:13px;color:#94a3b8;margin-top:7px}
.row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:20px 0;border-bottom:1px solid #eef1f6}
.row h3{font-size:14px;font-weight:650;color:#263653}
.row p{font-size:12px;color:#98a4b7;margin-top:6px;line-height:1.45}
.toggle{width:43px;height:24px;border:0;border-radius:20px;background:#cbd5e1;position:relative;cursor:pointer;flex-shrink:0}
.toggle:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:white;left:3px;top:3px;transition:.2s;box-shadow:0 1px 3px #0002}
.toggle.on{background:#2864df}.toggle.on:after{left:22px}
select{border:1px solid #dfe6f0;border-radius:9px;padding:9px 12px;color:#43516a;background:#fff;font-size:12px;min-width:130px}
.action{background:#edf4ff;color:#2864df;border:0;padding:9px 13px;border-radius:8px;font-size:12px;font-weight:650;cursor:pointer}
.footer{display:flex;justify-content:flex-end;align-items:center;gap:15px;margin-top:25px}
.status{font-size:12px;color:#16a36a}
.save{background:#2864df;color:white;border:0;border-radius:9px;padding:11px 19px;font-size:12px;font-weight:650;cursor:pointer;box-shadow:0 4px 10px #2864df30}
@media(max-width:700px){.app{padding:22px 13px}.layout{grid-template-columns:1fr}.sidebar{padding:13px}.brand{padding:4px 8px 13px}.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px}.menu button{font-size:11px;padding:11px 8px;gap:7px}.panel{padding:22px 18px;min-height:480px}.row{padding:17px 0}.row p{max-width:220px}}
</style>
</head>
<body>
<div class="app">
<header><h1>Settings</h1><p>Manage your Maria AI experience and preferences.</p></header>
<div class="layout">
<aside class="sidebar">
  <div class="brand"><strong>Maria AI</strong><span>CONTROL CENTER</span></div>
  <nav class="menu" id="menu">
    <button class="active" data-page="general"><span class="icon">⚙</span>General</button>
    <button data-page="ai"><span class="icon">✧</span>AI Behavior</button>
    <button data-page="memory"><span class="icon">◈</span>Memory</button>
    <button data-page="connectors"><span class="icon">⌘</span>Connectors</button>
    <button data-page="security"><span class="icon">⬡</span>Security</button>
    <button data-page="notifications"><span class="icon">♧</span>Notifications</button>
    <button data-page="voice"><span class="icon">♫</span>Voice</button>
    <button data-page="privacy"><span class="icon">▣</span>Data & Privacy</button>
    <button data-page="advanced"><span class="icon">⚒</span>Advanced</button>
    <button data-page="about"><span class="icon">ⓘ</span>About</button>
  </nav>
</aside>
<main class="panel">
  <div class="panel-head"><h2 id="title">General</h2><p id="desc">Manage your general preferences.</p></div>
  <div id="content"></div>
  <div class="footer"><span class="status" id="status"></span><button class="save" id="save">Save Changes</button></div>
</main>
</div>
</div>
<script>
const pages={
general:{desc:"Manage your general preferences.",items:[["Dark Mode","Enable a darker interface across Maria AI.","toggle","darkMode"],["Notifications","Receive important system notifications.","toggle","notifications"],["Language","Choose your preferred application language.","select","language",["Indonesia","English"]]]},
ai:{desc:"Shape how Maria AI thinks and communicates.",items:[["Default AI Model","Choose the model Maria uses by default.","select","model",["Maria Default","Advanced Model"]],["Personalization","Adapt responses to your preferences.","toggle","personalization"],["Response Style","Choose Maria's communication style.","select","style",["Balanced","Professional","Friendly","Creative"]]]},
memory:{desc:"Manage what Maria AI can remember.",items:[["AI Memory","Allow Maria to remember useful information.","toggle","memory"],["Conversation Context","Use relevant context from previous chats.","toggle","context"]]},
connectors:{desc:"Manage connected apps and external services.",items:[["GitHub","Connect repositories and development workflows.","action"],["Google Drive","Access files you choose to share.","action"],["Gmail","Connect your email workspace.","action"],["Supabase","Connect your Supabase project.","action"],["MongoDB","Connect your MongoDB database.","action"]]},
security:{desc:"Manage account protection and security tools.",items:[["Spy Guard","Enable Maria's security monitoring feature.","toggle","spyGuard"],["Two-Factor Authentication","Add another layer of account protection.","action"],["Device Management","Review devices signed in to your account.","action"]]},
notifications:{desc:"Choose which updates Maria can send you.",items:[["System Notifications","Receive product and system updates.","toggle","notifications"],["Security Alerts","Get notified about security events.","toggle","securityAlerts"],["Notification Sound","Play a sound for notifications.","toggle","sound"]]},
voice:{desc:"Configure voice conversations with Maria.",items:[["Voice Mode","Enable voice-based conversations.","toggle","voice"],["Voice Language","Choose the voice interaction language.","select","voiceLanguage",["Indonesia","English"]],["Speaking Speed","Set the voice playback speed.","select","voiceSpeed",["Slow","Normal","Fast"]]]},
privacy:{desc:"Review and manage your personal data.",items:[["Conversation History","Save your conversations for later.","toggle","history"],["Export Data","Prepare a copy of your account data.","action"],["Manage Stored Data","Review information associated with your account.","action"]]},
advanced:{desc:"Tools and configuration for advanced users.",items:[["Developer Mode","Show additional developer options.","toggle","developer"],["API Configuration","Manage API-related settings.","action"],["System Diagnostics","Check application diagnostics.","action"]]},
about:{desc:"Information about this application.",items:[["Application","Maria AI Assistant · Version 1.0.0","text",""],["Developer","Created by Zan.Dev","text",""],["Project Status","Prototype interface","text",""]]}
};
let state={darkMode:false,notifications:true,personalization:true,memory:true,context:true,spyGuard:true,securityAlerts:true,sound:false,voice:false,history:true,developer:false};
try{state={...state,...JSON.parse(localStorage.getItem("maria-settings-preview")||"{}")}}catch(e){}
const content=document.getElementById("content");
function render(page){
 const data=pages[page];document.getElementById("title").textContent=page==="ai"?"AI Behavior":data.title||page[0].toUpperCase()+page.slice(1);
 document.getElementById("desc").textContent=data.desc;document.getElementById("status").textContent="";
 document.querySelectorAll(".menu button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 content.innerHTML="";
 data.items.forEach(([name,description,type,key,options])=>{
  const row=document.createElement("div");row.className="row";
  const info=document.createElement("div");const h=document.createElement("h3");h.textContent=name;const p=document.createElement("p");p.textContent=description;info.append(h,p);
  let control;
  if(type==="toggle"){control=document.createElement("button");control.className="toggle"+(state[key]?" on":"");control.setAttribute("aria-label",name);control.onclick=()=>{state[key]=!state[key];control.classList.toggle("on",state[key]);}}
  else if(type==="select"){control=document.createElement("select");options.forEach(o=>{let op=document.createElement("option");op.textContent=o;op.value=o;control.append(op)});control.value=state[key]||options[0];control.onchange=()=>state[key]=control.value}
  else if(type==="action"){control=document.createElement("button");control.className="action";control.textContent="Configure";control.onclick=()=>alert(name+" belum terhubung ke backend Maria AI.")}
  else{control=document.createElement("span");control.style.cssText="font-size:12px;color:#64748b";control.textContent=key}
  row.append(info,control);content.append(row);
 });
}
document.querySelectorAll(".menu button").forEach(b=>b.onclick=()=>render(b.dataset.page));
document.getElementById("save").onclick=()=>{localStorage.setItem("maria-settings-preview",JSON.stringify(state));document.getElementById("status").textContent="✓ Settings saved in this browser";};
render("general");
</script>
</body>
</html>
